name: Genereer snake-animatie

on:
  # elke nacht verversen
  schedule:
    - cron: "0 2 * * *"
  # handmatig kunnen starten via de Actions-tab
  workflow_dispatch:
  # ook meteen bij een push naar main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Genereer snake-svg's (licht + donker, in huisstijl)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=007F79&color_dots=e8e3f0,b492ff,6b37b2,4a1a8a,350F66
            dist/snake-dark.svg?palette=github-dark&color_snake=2EC9BF&color_dots=1b1330,4a1a8a,6b37b2,8b5cf6,b492ff

      - name: Publiceer naar de output-branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
